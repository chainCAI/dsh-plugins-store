name: Sync catalog

on:
  schedule:
    # 每 30 分钟自动同步一次；catalog.json 有变化时才提交，
    # push 到 main 会触发 Cloudflare Pages 自动重新构建部署
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-catalog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync GitHub Topic
        run: npm run sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Test
        run: npm test

      - name: Commit catalog changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/catalog.json
          if git diff --cached --quiet; then
            echo "catalog.json 无变化，跳过提交"
          else
            git commit -m "chore: sync catalog $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin main
            echo "已提交并推送，Cloudflare Pages 将自动重建"
          fi
