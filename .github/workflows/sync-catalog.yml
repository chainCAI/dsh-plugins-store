name: Sync catalog

on:
  schedule:
    # 每 30 分钟自动同步一次；catalog.json 有变化时才提交并部署 Cloudflare Pages
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-catalog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync GitHub Topic
        run: npm run sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync community submissions
        run: npm run sync:community
        env:
          COMMUNITY_API_URL: ${{ vars.COMMUNITY_API_URL }}

      - name: Test
        run: npm test

      - name: Commit catalog changes
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/catalog.json src/data/community.json
          if git diff --cached --quiet; then
            echo "catalog.json 无变化，跳过提交"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: sync catalog $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin main
            echo "已提交并推送"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pages 项目未连接 Git 仓库，只能直传部署；仅当目录有变化时执行
      - name: Deploy to Cloudflare Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm run build
          npx wrangler pages deploy dist --project-name=dsh --branch=main
